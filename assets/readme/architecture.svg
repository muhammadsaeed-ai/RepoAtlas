<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d"><title id="t">RepoAtlas architecture</title><desc id="d">Four stages: safe filesystem scanning, Python AST extraction, graph and rule analysis, and export rendering.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111F"/><stop offset="1" stop-color="#10172D"/></linearGradient></defs><rect width="1200" height="300" rx="20" fill="url(#bg)" stroke="#1E4166"/><text x="28" y="35" fill="#F0F7FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="750">ENGINEERING ARCHITECTURE</text><text x="1172" y="35" text-anchor="end" fill="#82A7CE" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">separated responsibilities · zero runtime dependencies</text><g transform="translate(28 61)"><rect width="255" height="150" rx="13" fill="#0B1F34" stroke="#286A98"/><text x="17" y="27" fill="#58DDF8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="800" letter-spacing="1.2">01 / SCAN</text><text x="17" y="53" fill="#EFF7FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">Filesystem inventory</text><text x="17" y="78" fill="#96B5D4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5">Ignore-aware traversal</text><text x="17" y="96" fill="#96B5D4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5">Relative paths + bounds</text><text x="17" y="125" fill="#5CE0FF" font-family="ui-monospace,Consolas,monospace" font-size="11">core.py</text></g><path d="M288 136h17m-7-6 7 6-7 6" stroke="#35DDF8" stroke-width="2" fill="none"/><g transform="translate(310 61)"><rect width="255" height="150" rx="13" fill="#0B1F34" stroke="#286A98"/><text x="17" y="27" fill="#58DDF8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="800" letter-spacing="1.2">02 / PARSE</text><text x="17" y="53" fill="#EFF7FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">Python AST</text><text x="17" y="78" fill="#96B5D4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5">Imports + symbol metrics</text><text x="17" y="96" fill="#96B5D4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5">Entry point signals</text><text x="17" y="125" fill="#5CE0FF" font-family="ui-monospace,Consolas,monospace" font-size="11">ast.parse()</text></g><path d="M570 136h17m-7-6 7 6-7 6" stroke="#35DDF8" stroke-width="2" fill="none"/><g transform="translate(592 61)"><rect width="255" height="150" rx="13" fill="#161B39" stroke="#6B5DA7"/><text x="17" y="27" fill="#B5A3FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="800" letter-spacing="1.2">03 / ANALYZE</text><text x="17" y="53" fill="#F2EEFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">Graph + findings</text><text x="17" y="78" fill="#B4ACDE" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5">Project import resolution</text><text x="17" y="96" fill="#B4ACDE" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5">Cycle / degree metrics</text><text x="17" y="125" fill="#C4B4FF" font-family="ui-monospace,Consolas,monospace" font-size="11">Kosaraju SCC</text></g><path d="M852 136h17m-7-6 7 6-7 6" stroke="#A98AFF" stroke-width="2" fill="none"/><g transform="translate(874 61)"><rect width="298" height="150" rx="13" fill="#0B202D" stroke="#287E80"/><text x="17" y="27" fill="#60E1C9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="800" letter-spacing="1.2">04 / EXPORT</text><text x="17" y="53" fill="#EDFFFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">Renderer layer</text><text x="17" y="78" fill="#92C7C0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5">Markdown + Mermaid</text><text x="17" y="96" fill="#92C7C0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5">Standalone SVG + JSON</text><text x="17" y="125" fill="#65E8D0" font-family="ui-monospace,Consolas,monospace" font-size="11">render.py</text></g><path d="M28 235h1144" stroke="#203D5E"/><text x="28" y="261" fill="#E3F1FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">SAFETY BY DESIGN</text><text x="186" y="261" fill="#91ACC8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">No source execution · no telemetry · no uploads · size-bounded reads · escaped SVG labels</text></svg>