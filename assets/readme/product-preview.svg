<text x="34" y="42" fill="#F3F7FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="760">RepoAtlas <tspan fill="#49DDF9">/</tspan> output preview</text>
<text x="34" y="67" fill="#86A9CA" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">INCLUDED DEMO FIXTURE · STATIC IMPORT RELATIONSHIPS</text>
