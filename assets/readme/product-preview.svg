<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="625" viewBox="0 0 1200 625" role="img" aria-labelledby="title desc">
<title id="title">RepoAtlas demo map and diagnostic finding</title>
<desc id="desc">Curated demo fixture preview with four Python modules, four resolved internal import edges, one import cycle, and a diagnostic panel. Counts describe the included example, not a benchmark.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050B17"/><stop offset=".56" stop-color="#0A1830"/><stop offset="1" stop-color="#15102B"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="10"/></filter>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#43D8F5"/></marker>
  <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#FF8F9F"/></marker>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#315271" opacity=".23"/></pattern>
</defs>
<rect width="1200" height="625" rx="24" fill="url(#bg)" stroke="#274766"/>
<rect width="1200" height="625" rx="24" fill="url(#grid)"/>
