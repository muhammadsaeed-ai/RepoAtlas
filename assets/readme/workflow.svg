<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="255" viewBox="0 0 1200 255" role="img" aria-labelledby="t d"><title id="t">RepoAtlas analysis workflow</title><desc id="d">Inventory the repository, parse Python modules, build dependency relationships, and export visual and machine-readable reports.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06101D"/><stop offset="1" stop-color="#10182E"/></linearGradient><linearGradient id="c" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22DDF7"/><stop offset="1" stop-color="#4C80FF"/></linearGradient><linearGradient id="v" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#757AFF"/><stop offset="1" stop-color="#B67CFF"/></linearGradient></defs><rect width="1200" height="255" rx="20" fill="url(#bg)" stroke="#1D4266"/><text x="27" y="34" fill="#F0F7FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="750">FROM SOURCE TREE TO ARCHITECTURE</text><text x="1170" y="34" text-anchor="end" fill="#82A6CC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">static analysis · repeatable outputs</text><g transform="translate(26 55)"><rect width="260" height="150" rx="14" fill="#0B1F34" stroke="#2A699A"/><circle cx="27" cy="27" r="14" fill="url(#c)"/><text x="27" y="32" text-anchor="middle" fill="#061421" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="800">01</text><text x="49" y="31" fill="#F0F8FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">Inventory files</text><text x="17" y="59" fill="#91B4D4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5">Ignore-aware and bounded.</text><rect x="16" y="80" width="228" height="48" rx="8" fill="#06101E" stroke="#264965"/><text x="28" y="100" fill="#71E0FF" font-family="ui-monospace,Consolas,monospace" font-size="11">.gitignore + exclusions</text><text x="28" y="117" fill="#9BB2CA" font-family="ui-monospace,Consolas,monospace" font-size="10">relative path inventory</text></g><path d="M290 130h16m-7-6 7 6-7 6" stroke="#35DFFF" stroke-width="2" fill="none"/><g transform="translate(310 55)"><rect width="260" height="150" rx="14" fill="#0B1F34" stroke="#2A699A"/><circle cx="27" cy="27" r="14" fill="url(#c)"/><text x="27" y="32" text-anchor="middle" fill="#061421" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="800">02</text><text x="49" y="31" fill="#F0F8FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">Parse Python AST</text><text x="17" y="59" fill="#91B4D4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5">No target-code execution.</text><rect x="16" y="80" width="228" height="48" rx="8" fill="#06101E" stroke="#264965"/><text x="28" y="100" fill="#71E0FF" font-family="ui-monospace,Consolas,monospace" font-size="11">imports + symbols</text><text x="28" y="117" fill="#9BB2CA" font-family="ui-monospace,Consolas,monospace" font-size="10">metrics + entry points</text></g><path d="M574 130h16m-7-6 7 6-7 6" stroke="#35DFFF" stroke-width="2" fill="none"/><g transform="translate(594 55)"><rect width="260" height="150" rx="14" fill="#161B39" stroke="#6759A6"/><circle cx="27" cy="27" r="14" fill="url(#v)"/><text x="27" y="32" text-anchor="middle" fill="#130F2A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="800">03</text><text x="49" y="31" fill="#F2EEFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">Build graph</text><text x="17" y="59" fill="#B3A9E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5">Connect project imports.</text><rect x="16" y="80" width="228" height="48" rx="8" fill="#090F22" stroke="#51478B"/><text x="28" y="100" fill="#CAB9FF" font-family="ui-monospace,Consolas,monospace" font-size="11">edges + strong components</text><text x="28" y="117" fill="#A6A4D6" font-family="ui-monospace,Consolas,monospace" font-size="10">cycle detection</text></g><path d="M858 130h16m-7-6 7 6-7 6" stroke="#A68AFF" stroke-width="2" fill="none"/><g transform="translate(878 55)"><rect width="296" height="150" rx="14" fill="#0B202D" stroke="#267D7F"/><circle cx="27" cy="27" r="14" fill="#4CE4BE"/><text x="27" y="32" text-anchor="middle" fill="#06241D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="800">04</text><text x="49" y="31" fill="#EDFFFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">Export &amp; review</text><text x="17" y="59" fill="#92C8C0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5">One snapshot, four formats.</text><rect x="16" y="80" width="264" height="48" rx="8" fill="#06141F" stroke="#245E64"/><text x="28" y="100" fill="#74EBD6" font-family="ui-monospace,Consolas,monospace" font-size="11">JSON · Markdown</text><text x="28" y="117" fill="#9AC9C1" font-family="ui-monospace,Consolas,monospace" font-size="10">Mermaid · SVG</text></g><text x="27" y="236" fill="#7898B9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">A static import edge is evidence of a declared relationship—not proof that a code path executes at runtime.</text></svg>