name: One-time source formatter

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Ruff
        run: python -m pip install --upgrade ruff
      - name: Apply consistent formatting
        run: python -m ruff format src tests examples
      - name: Commit formatting changes if needed
        run: |
          if git diff --quiet; then
            echo "Repository is already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests examples
          git commit -m "[skip ci] style: apply Ruff formatting to source and tests"
          git push origin HEAD:main
