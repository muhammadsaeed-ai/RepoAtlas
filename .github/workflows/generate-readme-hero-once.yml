name: Generate animated README hero (one-time)

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Pillow for artwork generation
        run: python -m pip install --upgrade Pillow
      - name: Render corrected animated README hero
        run: python scripts/generate_readme_hero.py
      - name: Publish corrected GIF and remove temporary workflow
        run: |
          rm .github/workflows/generate-readme-hero-once.yml
          git add assets/readme/readme-hero.gif
          git add -u .github/workflows/generate-readme-hero-once.yml
          if git diff --cached --quiet; then
            echo "No generated asset changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "[skip ci] fix: prevent README hero text overlap"
          git push origin HEAD:main
